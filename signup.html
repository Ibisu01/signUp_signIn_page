<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form id="signupForm" action="signup.php" method="POST">
        <div id="page1" class="page active-page">
            <div class="form-group">
                <label for="firstname">First Name</label>
                <input type="text" id="firstname" name="firstname" oninput="this.value = this.value.replace(/[^A-Za-z\s]/g, '')" required>
            </div>
            
            <div class="form-group">
                <label for="middlename">Middle Name</label>
                <input type="text" id="middlename" name="middlename" oninput="this.value = this.value.replace(/[^A-Za-z\s]/g, '')">
            </div>

            <div class="form-group">
                <label for="lastname">Last Name</label>
                <input type="text" id="lastname" name="lastname" oninput="this.value = this.value.replace(/[^A-Za-z\s]/g, '')" required>
            </div>

            <div class="form-group">
                <label for="phonenumber">Phone Number:</label>
                <input type="tel" id="phonenumber" name="phonenumber" maxlength="11" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="button" class="single-btn" id="nextBtn">Next</button>
            <p>Already have an account? <a href="signin.html">Sign In</a></p>
        </div>

        <div id="page2" class="page">
            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" required>
            </div>

            <div class="form-group">
                <label for="nationality">Nationality</label>
                <input type="text" id="nationality" name="nationality" required>
            </div>

            <div class="form-group">
                <label for="state_of_origin">State of Origin</label>
                <input type="text" id="state_of_origin" name="state_of_origin" required>
            </div>

            <div class="form-group">
                <label for="bloodgroup">Blood Group</label>
                <select id="bloodgroup" name="bloodgroup" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; background: white;">
                    <option value="">Select...</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </div>

            <div class="form-group">
                <label for="genotype">Genotype</label>
                <select id="genotype" name="genotype" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; background: white;">
                    <option value="">Select...</option>
                    <option value="AA">AA</option>
                    <option value="AS">AS</option>
                    <option value="SS">SS</option>
                    <option value="AC">AC</option>
                </select>
            </div>

            <div class="btn-container">
                <button type="button" id="backBtn">Back</button>
                <button type="submit">Complete Sign Up</button>
            </div>
        </div>
    </form>

    <script src="signup.js"></script>
</body>
</html>
